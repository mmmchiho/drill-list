<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>教材リスト</title>
<style>
body{font-family:-apple-system,"Hiragino Sans",sans-serif;background:#f2f2f7;margin:0;padding:12px;max-width:640px;margin:auto;color:#222}
h1{font-size:18px;margin:4px 0 10px}
h2{font-size:13px;color:#555;margin:14px 0 6px}
.tabs{display:flex;background:#e5e5ea;border-radius:10px;padding:2px;margin-bottom:10px}
.tab{flex:1;border:0;background:none;padding:8px;font-size:14px;border-radius:8px;color:#333}
.tab.on{background:#fff;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:0;border-radius:16px;padding:6px 12px;font-size:12px;background:#fff;color:#333}
.chip.on{background:#007aff;color:#fff}
.card{background:#fff;border-radius:12px;padding:10px;margin-bottom:8px}
input,select{width:100%;box-sizing:border-box;padding:7px 8px;font-size:16px;border:.5px solid #ccc;border-radius:8px;margin-top:6px;background:#fff}
.name{font-weight:600;margin:0}
.row{display:flex;gap:8px;align-items:center}
.del{border:0;background:none;color:#ff3b30;font-size:12px;white-space:nowrap}
.btn{border:0;border-radius:10px;padding:9px 12px;font-size:13px;background:#007aff;color:#fff}
.btn.s{background:#e5e5ea;color:#222}
.tag{font-size:11px;color:#888;margin-top:8px}
.a{font-size:14px}
.li{background:#fff;padding:9px 12px;font-size:13px;line-height:1.4;border-bottom:.5px solid #eee}
.li:first-of-type{border-radius:10px 10px 0 0}.li:last-child{border-radius:0 0 10px 10px;border-bottom:0}
.li:only-child{border-radius:10px}
.b{font-size:10px;color:#666;background:#eee;border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.res{text-align:center;padding:18px 10px;border-radius:12px;font-size:15px;font-weight:600;margin-bottom:10px}
.res.ok{background:#e3f6e8;color:#1b7a34}.res.ng{background:#ffe5e3;color:#c4261d}
</style></head><body>
<h1>📚 教材リスト <span id="cnt" style="font-size:12px;color:#888"></span></h1>
<div class="tabs"><button class="tab" id="t-view" onclick="setTab('view')">一覧（書店用）</button><button class="tab" id="t-edit" onclick="setTab('edit')">編集</button></div>

<div id="v-view">
  <input id="q" type="search" placeholder="教材名や番号で検索（例：点図形、35）" oninput="renderView()" style="margin:0 0 10px">
  <div id="res"></div>
  <div id="vlist"></div>
</div>

<div id="v-edit" style="display:none">
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <div class="card">
    <div class="row"><input id="newName" placeholder="教材名を追加" style="margin:0"><button class="btn" onclick="add()">追加</button></div>
  </div>
  <div class="card">
    <div class="tag" style="margin-top:0">バックアップ・GitHub用</div>
    <div class="row" style="margin-top:8px;flex-wrap:wrap">
      <button class="btn s" onclick="exportCsv()">CSV書き出し</button>
      <button class="btn s" onclick="exportJson()">JSON書き出し</button>
    </div>
    <div class="tag">ドリルチェッカーのバックアップJSON／このアプリのJSONを取り込む</div>
    <input type="file" accept=".json" onchange="importJson(this)">
  </div>
</div>

<script>
const FORMS=['未確認','紙のみ','PDFのみ','紙+PDF'];
const SEED=["ばっちりくんドリル【基礎編】109 長文の記憶", "ばっちりくんドリル【基礎編】79 理科的常識(生き物)", "ばっちりくんドリル【基礎編】81 理科的常識(植物)", "ばっちりくんドリル【基礎編】83 理科的常識(自然・科学)", "ばっちりくんドリル【基礎編】93 条件推理", "ひとりでとっくん 22 はさみぎり(基礎編)", "ひとりでとっくん365日 01基礎1-A", "ひとりでとっくん365日 02基礎1-B", "ひとりでとっくん365日 03基礎2-A", "ひとりでとっくん365日 04基礎2-B", "ひとりでとっくん365日 05基礎3-A", "ひとりでとっくん単元別　2 点図形2", "ひとりでとっくん単元別　3 点図形3", "ひとりでとっくん単元別　10 同数発見", "ひとりでとっくん単元別　11 同図形発見", "ひとりでとっくん単元別　17 分類係数2", "ひとりでとっくん単元別　29 仲間はずれ", "ひとりでとっくん単元別　35 一対多対応", "ひとりでとっくん単元別　38 数の構成", "ひとりでとっくん単元別　96 図形分割2", "ピンポンワーク 年中6月", "ピンポンワーク 年中8月", "ピンポンワーク 年中9月", "新版ばっちりくんドリル【基礎編】9 倍数・１対多対応", "新版ばっちりくんドリル【応用編】16 規則性", "新版ばっちりくんドリル【応用編】54 2つ折り・4つ折り・折り目", "新版ばっちりくんドリル【基礎編】23 言葉", "新版ばっちりくんドリル【基礎編】31 話の理解", "新版ばっちりくんドリル【応用編】62 見え方", "新版ばっちりくんドリル【基礎編】35 点図形①", "新版ばっちりくんドリル【基礎編】39 同形発見・同配列発見", "新版ばっちりくんドリル【基礎編】37 点図形②", "新版ばっちりくんドリル【基礎編】55 重ね図形•重なった図形", "新版ばっちりくんドリル【基礎編】59 立体図形・展開図", "新版ばっちりくんドリル【基礎編】63 映像の記憶", "新版ばっちりくんドリル【基礎編】65 位置の理解・位置の推理", "新版ばっちりくんドリル【基礎編】73 重さの比較・重さの推理", "新版ばっちりくんドリル【基礎編】79 生活常識①", "新版ばっちりくんドリル【基礎編】83 季節•行事", "ひとりでとっくん単元別　54 理科的常識①", "ひとりでとっくん単元別　51 重ね点図形"];
const mk=n=>({name:n,form:'未確認',url:'',loc:'',note:''});
let items=[];
try{items=JSON.parse(localStorage.getItem('ml_items')||'null')||[]}catch(e){items=[]}
// 初回（v2）だけ、初期リストにある教材のうち未登録のものを追加
try{if(!localStorage.getItem('ml_seeded_v2')){SEED.forEach(n=>{if(!items.some(e=>e.name===n))items.push(mk(n))});localStorage.setItem('ml_seeded_v2','1');localStorage.setItem('ml_items',JSON.stringify(items))}}catch(e){if(!items.length)items=SEED.map(mk)}
let filter='すべて',tab='view';
const save=()=>{try{localStorage.setItem('ml_items',JSON.stringify(items))}catch(e){}};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const norm=s=>String(s).normalize('NFKC').toLowerCase().replace(/\s+/g,'');
const SERIES=['ばっちりくんドリル','新版ばっちりくんドリル','ひとりでとっくん365日','ひとりでとっくん単元別','ひとりでとっくん','ピンポンワーク'];
function seriesOf(n){
  const m=[...SERIES].sort((a,b)=>b.length-a.length).find(s=>n.startsWith(s));
  return m||'その他';
}
// 表示用：「番号. 教材名【基礎編】」の形に並べ替える（保存されている名前は変えない）
function parseName(name,s){
  let rest=name.startsWith(s)?name.slice(s.length).trim():name;
  let tag='';
  const t=rest.match(/^【([^】]+)】\s*/);
  if(t){tag=t[1];rest=rest.slice(t[0].length)}
  const m=rest.match(/^(\d+)\s*(.*)$/);
  const tail=tag?'【'+tag+'】':'';
  if(m)return{n:parseInt(m[1],10),text:m[1]+'. '+m[2]+tail};
  return{n:Infinity,text:rest+tail};
}
function setTab(t){tab=t;
  document.getElementById('v-view').style.display=t==='view'?'':'none';
  document.getElementById('v-edit').style.display=t==='edit'?'':'none';
  document.getElementById('t-view').className='tab'+(t==='view'?' on':'');
  document.getElementById('t-edit').className='tab'+(t==='edit'?' on':'');
  render();
}
function renderView(){
  const q=norm(document.getElementById('q').value);
  const hit=items.filter(it=>!q||norm(it.name).includes(q));
  const res=document.getElementById('res');
  if(q){res.innerHTML=hit.length?`<div class="res ok">持っています ✓（${hit.length}件）</div>`:'<div class="res ng">持っていません（リストにありません）</div>'}
  else res.innerHTML='';
  const groups={};
  hit.forEach(it=>{(groups[seriesOf(it.name)]=groups[seriesOf(it.name)]||[]).push(it)});
  const order=[...SERIES,'その他'].filter(s=>groups[s]);
  document.getElementById('vlist').innerHTML=order.map(s=>{
    const arr=groups[s].map(it=>({it,p:parseName(it.name,s)})).sort((a,b)=>(a.p.n-b.p.n)||a.p.text.localeCompare(b.p.text,'ja',{numeric:true}));
    return `<h2>${esc(s)}（${arr.length}）</h2>`+arr.map(({it,p})=>`<div class="li">${esc(p.text)}${it.form==='紙のみ'?'<span class="b">紙</span>':it.form==='PDFのみ'?'<span class="b">PDF</span>':it.form==='紙+PDF'?'<span class="b">紙+PDF</span>':''}</div>`).join('');
  }).join('');
}
function renderEdit(){
  document.getElementById('chips').innerHTML=['すべて',...FORMS].map(f=>`<button class="chip${f===filter?' on':''}" onclick="filter='${f}';render()">${f}</button>`).join('');
  document.getElementById('list').innerHTML=items.map((it,i)=>filter!=='すべて'&&it.form!==filter?'':`
  <div class="card">
    <div class="row"><input class="name" value="${esc(it.name)}" style="margin:0" onchange="upd(${i},'name',this.value)"><button class="del" onclick="del(${i})">削除</button></div>
    <select onchange="upd(${i},'form',this.value);render()">${FORMS.map(f=>`<option${f===it.form?' selected':''}>${f}</option>`).join('')}</select>
    <input class="a" placeholder="GoogleドライブのURL" value="${esc(it.url)}" onchange="upd(${i},'url',this.value)">
    <input class="a" placeholder="紙の保管場所（例：本棚2段目）" value="${esc(it.loc)}" onchange="upd(${i},'loc',this.value)">
    <input class="a" placeholder="備考" value="${esc(it.note)}" onchange="upd(${i},'note',this.value)">
  </div>`).join('')||'<div class="card">該当する教材がありません</div>';
}
function render(){document.getElementById('cnt').textContent=items.length+'件';tab==='view'?renderView():renderEdit()}
function upd(i,k,v){items[i][k]=v.trim();save()}
function del(i){if(confirm('「'+items[i].name+'」を削除しますか？')){items.splice(i,1);save();render()}}
function add(){const el=document.getElementById('newName');const n=el.value.trim();if(!n)return;items.push(mk(n));el.value='';save();render()}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
const today=()=>new Date().toISOString().slice(0,10);
function exportJson(){dl(`materials_${today()}.json`,JSON.stringify(items,null,2),'application/json')}
function exportCsv(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[['id','教材名','保管形態','Googleドライブのリンク','紙の保管場所','備考'],...items.map((it,i)=>[String(i+1).padStart(3,'0'),it.name,it.form,it.url,it.loc,it.note])];
  dl('materials.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')+'\n','text/csv');
}
function importJson(inp){
  const f=inp.files[0];if(!f)return;
  f.text().then(t=>{
    const d=JSON.parse(t);let added=0;
    const list=Array.isArray(d)?d:(d.drills||[]);
    list.forEach(x=>{const it=typeof x==='string'?mk(x):{...mk(''),...x};
      if(it.name&&!items.some(e=>e.name===it.name)){items.push(it);added++}});
    save();render();alert(added+'件を追加しました');
  }).catch(()=>alert('読み込めませんでした'));inp.value='';
}
setTab('view');
</script></body></html>
